name: KuroToon Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed KuroToon APKs
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release tag
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f3819c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/kurotoon.keystore"

      - name: Build release APKs
        run: ./gradlew assembleRelease -Pdist=github
        env:
          MIHON_GITHUB_RELEASE: "true"
          storeFile: ${{ runner.temp }}/kurotoon.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        env:
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-universal-release.apk "Crochan.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "KuroToon-arm64-v8a-${TAG}.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "KuroToon-armeabi-v7a-${TAG}.apk"
          mv app/build/outputs/apk/release/app-x86-release.apk "KuroToon-x86-${TAG}.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "KuroToon-x86_64-${TAG}.apk"

      - name: Upload release APKs as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuroToon-${{ steps.extract.outputs.tag }}
          if-no-files-found: error
          path: |
            Crochan.apk
            KuroToon-arm64-v8a-${{ steps.extract.outputs.tag }}.apk
            KuroToon-armeabi-v7a-${{ steps.extract.outputs.tag }}.apk
            KuroToon-x86-${{ steps.extract.outputs.tag }}.apk
            KuroToon-x86_64-${{ steps.extract.outputs.tag }}.apk

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.extract.outputs.tag }}
          name: KuroToon ${{ steps.extract.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌌 KuroToon ${{ steps.extract.outputs.tag }}

            Your manga universe. Your way. 💜

            ### Downloads
            - **Crochan.apk (universal APK)** — direct download; recommended if you're unsure which file fits your device.
            - **arm64-v8a APK** — most modern 64-bit Android phones.
            - **armeabi-v7a APK** — older 32-bit ARM devices.
            - **x86 / x86_64 APKs** — mainly for compatible emulators.

            Review the release notes before installing. Android may require confirmation. Keep your reading data backed up when testing updates.

            KuroToon is currently free; this release does not introduce paid tiers or a paywall.
          files: |
            Crochan.apk
            KuroToon-arm64-v8a-${{ steps.extract.outputs.tag }}.apk
            KuroToon-armeabi-v7a-${{ steps.extract.outputs.tag }}.apk
            KuroToon-x86-${{ steps.extract.outputs.tag }}.apk
            KuroToon-x86_64-${{ steps.extract.outputs.tag }}.apk
